services:
  web:
    image: ghcr.io/nokijai/knowledge-base:latest
    container_name: knowledge-base
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /apps/knowledge-base/content:/app/content:ro
    env_file:
      - /apps/knowledge-base/.env
      - /apps/knowledge-base/.env.local
    restart: unless-stopped
